<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the stream</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #eaffea;
      background:
        radial-gradient(ellipse at 18% 25%, rgba(57, 255, 20, 0.18), transparent 28%),
        radial-gradient(ellipse at 82% 72%, rgba(175, 0, 255, 0.2), transparent 30%),
        #030507;
      font-family: Arial, sans-serif;
    }

    .helix {
      position: fixed;
      top: -8%;
      width: clamp(42px, 8vw, 100px);
      height: 116%;
      z-index: 0;
      opacity: 0.78;
      filter: drop-shadow(0 0 8px rgba(57, 255, 20, 0.55));
      transform-style: preserve-3d;
      animation: helix-spin 7s ease-in-out infinite;
      pointer-events: none;
    }

    .helix-left {
      left: 3%;
    }

    .helix-right {
      right: 3%;
      animation-delay: -3.5s;
      filter: drop-shadow(0 0 8px rgba(190, 50, 255, 0.6));
    }

    .helix path {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .helix .green-strand {
      stroke: #39ff14;
      filter: drop-shadow(0 0 3px #39ff14);
    }

    .helix .purple-strand {
      stroke: #bd4dff;
      filter: drop-shadow(0 0 3px #bd4dff);
    }

    .helix .rungs {
      stroke: rgba(220, 255, 230, 0.8);
      stroke-width: 1.6;
      stroke-dasharray: 2 1;
    }

    .helix .center-line {
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 1;
      stroke-dasharray: 3 8;
      animation: rung-flow 3s linear infinite;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(620px, 100%);
      height: min(72vh, 650px);
      min-height: 380px;
      display: flex;
      flex-direction: column;
      padding: 24px;
      border: 1px solid rgba(57, 255, 20, 0.42);
      border-radius: 16px;
      background: rgba(3, 8, 8, 0.82);
      box-shadow: 0 0 28px rgba(57, 255, 20, 0.13), 0 0 50px rgba(175, 0, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    h1 {
      position: relative;
      isolation: isolate;
      margin: 0 0 18px;
      color: #39ff14;
      text-align: center;
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px #39ff14, 0 0 20px rgba(57, 255, 20, 0.85);
      animation: title-flicker 3.2s steps(1, end) infinite;
    }

    h1::before,
    h1::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    h1::before {
      color: #d352ff;
      text-shadow: 0 0 10px rgba(189, 77, 255, 0.9);
      clip-path: inset(0 0 55% 0);
      transform: translate(-2px, 0);
      animation: title-glitch-top 2.4s steps(1, end) infinite;
    }

    h1::after {
      color: #8dff73;
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.8);
      clip-path: inset(58% 0 0 0);
      transform: translate(2px, 0);
      animation: title-glitch-bottom 1.9s steps(1, end) infinite;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
      border-block: 1px solid rgba(255, 255, 255, 0.12);
      overflow-wrap: anywhere;
    }

    .message {
      width: fit-content;
      max-width: 85%;
      margin: 12px 0;
      padding: 10px 14px;
      border: 1px solid rgba(57, 255, 20, 0.35);
      border-radius: 12px 12px 12px 2px;
      background: rgba(57, 255, 20, 0.1);
      white-space: pre-wrap;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px 14px;
      border: 1px solid rgba(189, 77, 255, 0.65);
      border-radius: 8px;
      outline: none;
      color: white;
      background: #090b10;
      font: inherit;
    }

    input:focus {
      border-color: #39ff14;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      color: #061006;
      background: #39ff14;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #8aff76;
    }

    @keyframes helix-spin {
      0% { transform: perspective(600px) translateY(-18px) rotateY(0deg); }
      50% { transform: perspective(600px) translateY(18px) rotateY(180deg); }
      100% { transform: perspective(600px) translateY(-18px) rotateY(360deg); }
    }

    @keyframes rung-flow {
      to { stroke-dashoffset: -44; }
    }

    @keyframes title-flicker {
      0%, 19%, 21%, 63%, 65%, 100% { opacity: 1; }
      20%, 64% { opacity: 0.72; }
    }

    @keyframes title-glitch-top {
      0%, 88%, 100% { clip-path: inset(0 0 55% 0); transform: translate(-2px, 0); }
      89% { clip-path: inset(12% 0 68% 0); transform: translate(5px, -2px); }
      91% { clip-path: inset(35% 0 48% 0); transform: translate(-6px, 1px); }
      93% { clip-path: inset(4% 0 78% 0); transform: translate(3px, 0); }
    }

    @keyframes title-glitch-bottom {
      0%, 72%, 100% { clip-path: inset(58% 0 0 0); transform: translate(2px, 0); }
      73% { clip-path: inset(68% 0 12% 0); transform: translate(-5px, 2px); }
      75% { clip-path: inset(48% 0 28% 0); transform: translate(6px, -1px); }
      77% { clip-path: inset(82% 0 4% 0); transform: translate(-3px, 0); }
    }

    @media (max-width: 520px) {
      .helix-left { left: -12px; }
      .helix-right { right: -12px; }
      main { padding: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .helix,
      .helix .center-line,
      h1,
      h1::before,
      h1::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg class="helix helix-left" viewBox="0 0 60 400" preserveAspectRatio="none" aria-hidden="true">
    <path class="green-strand" d="M30 -20 C58 0 58 40 30 60 S2 120 30 140 S58 200 30 220 S2 280 30 300 S58 360 30 380 S2 440 30 460"></path>
    <path class="purple-strand" d="M30 -20 C2 0 2 40 30 60 S58 120 30 140 S2 200 30 220 S58 280 30 300 S2 360 30 380 S58 440 30 460"></path>
    <path class="rungs" d="M18 0h24 M10 20h40 M5 40h50 M10 60h40 M18 80h24 M26 100h8 M26 120h8 M18 140h24 M10 160h40 M5 180h50 M10 200h40 M18 220h24 M26 240h8 M26 260h8 M18 280h24 M10 300h40 M5 320h50 M10 340h40 M18 360h24 M26 380h8 M26 400h8"></path>
    <path class="center-line" d="M30 0v400"></path>
  </svg>

  <svg class="helix helix-right" viewBox="0 0 60 400" preserveAspectRatio="none" aria-hidden="true">
    <path class="green-strand" d="M30 -20 C58 0 58 40 30 60 S2 120 30 140 S58 200 30 220 S2 280 30 300 S58 360 30 380 S2 440 30 460"></path>
    <path class="purple-strand" d="M30 -20 C2 0 2 40 30 60 S58 120 30 140 S2 200 30 220 S58 280 30 300 S2 360 30 380 S58 440 30 460"></path>
    <path class="rungs" d="M18 0h24 M10 20h40 M5 40h50 M10 60h40 M18 80h24 M26 100h8 M26 120h8 M18 140h24 M10 160h40 M5 180h50 M10 200h40 M18 220h24 M26 240h8 M26 260h8 M18 280h24 M10 300h40 M5 320h50 M10 340h40 M18 360h24 M26 380h8 M26 400h8"></path>
    <path class="center-line" d="M30 0v400"></path>
  </svg>

  <main>
    <h1 data-text="the stream">the stream</h1>
    <section id="messages" aria-live="polite" aria-label="Messages"></section>
    <form id="message-form">
      <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" aria-label="Type a message">
      <button type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#message-form");
    const input = document.querySelector("#message-input");
    const messages = document.querySelector("#messages");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const message = document.createElement("p");
      message.className = "message";
      message.textContent = text;
      messages.append(message);
      input.value = "";
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    });
  </script>
</body>
</html>
